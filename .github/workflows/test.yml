name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================
  # Contract Tests (Rust/Cargo)
  # =============================================
  contract-tests:
    name: Contract Tests (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ['stable']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Add WASM build target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Soroban SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/soroban
            target/
          key: soroban-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build contracts
        run: |
          cd contracts
          cargo build --workspace --release --target wasm32-unknown-unknown

      - name: Run BountyRegistry tests
        run: |
          cd contracts
          cargo test --workspace --release

      - name: Verify contract builds produce WASM
        run: |
          ls -la contracts/target/wasm32-unknown-unknown/release/*.wasm

  # =============================================
  # Frontend Tests
  # =============================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint check
        run: npm run lint

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build

  # =============================================
  # Relay Tests
  # =============================================
  relay-tests:
    name: Relay Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: relay/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build relay
        run: npm run build

      - name: Run relay lint
        run: npm run lint

      - name: Run relay tests
        run: npm test -- --passWithNoTests

  # =============================================
  # Summary
  # =============================================
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [contract-tests, frontend-tests, relay-tests]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "=== Test Results Summary ==="
          echo "Contract tests: ${{ needs.contract-tests.result }}"
          echo "Frontend tests: ${{ needs.frontend-tests.result }}"
          echo "Relay tests: ${{ needs.relay-tests.result }}"
          
          if [[ "${{ needs.contract-tests.result }}" == "success" ]] && \
             [[ "${{ needs.frontend-tests.result }}" == "success" ]] && \
             [[ "${{ needs.relay-tests.result }}" == "success" ]]; then
            echo "All tests passed!"
          else
            echo "Some tests failed."
            exit 1
          fi
